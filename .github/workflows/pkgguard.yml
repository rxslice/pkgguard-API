name: pkgguard

# Blocks a build if any dependency looks hallucinated or slopsquatted.
on: [push, pull_request]

jobs:
  verify-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pkgguard
        run: pip install -e .

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify npm dependencies
        if: hashFiles('package.json') != ''
        run: pkgguard scan-manifest package.json

      - name: Verify Python dependencies
        if: hashFiles('requirements.txt') != ''
        run: pkgguard scan-manifest requirements.txt

      - name: Verify Rust dependencies
        if: hashFiles('Cargo.toml') != ''
        run: pkgguard scan-manifest Cargo.toml
