name: Publish package

on:
  release:
    types: [published]
  # A pushed version tag publishes too, so a release need not be created by hand.
  push:
    tags: ["v*"]
  # Run by hand from the Actions tab or the API, on the version committed to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
