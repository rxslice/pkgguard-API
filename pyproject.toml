[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blvkware-pkgguard"
dynamic = ["version"]
description = "Open-source AI package security gate for slopsquatting, hallucinated dependencies, and typosquats across npm, PyPI, and crates.io."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Blvkware", email = "russ@blvkware.dev" }]
keywords = [
    "slopsquatting", "supply-chain-security", "package-hallucination",
    "typosquatting", "dependency-confusion", "llm-security", "ai-security",
    "npm", "pypi", "crates-io", "sbom", "devsecops", "ci-cd-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://blvkware.dev"
Source = "https://github.com/rxslice/pkgguard-API"
Issues = "https://github.com/rxslice/pkgguard-API/issues"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.0"]
dev = ["pytest>=8.0", "httpx"]

[project.scripts]
pkgguard = "pkgguard.cli:main"
pkgguard-mcp = "pkgguard.mcp_server:main"
pkgguard-gate = "pkgguard.toolgate:main"
pkgguard-npm = "pkgguard.toolgate:main_npm"
pkgguard-yarn = "pkgguard.toolgate:main_yarn"
pkgguard-pnpm = "pkgguard.toolgate:main_pnpm"
pkgguard-bun = "pkgguard.toolgate:main_bun"
pkgguard-pip = "pkgguard.toolgate:main_pip"
pkgguard-pip3 = "pkgguard.toolgate:main_pip3"
pkgguard-uv = "pkgguard.toolgate:main_uv"
pkgguard-poetry = "pkgguard.toolgate:main_poetry"
pkgguard-cargo = "pkgguard.toolgate:main_cargo"

[tool.setuptools]
packages = ["pkgguard", "pkgguard.data"]

[tool.setuptools.dynamic]
version = { attr = "pkgguard.__version__" }

[tool.setuptools.package-data]
"pkgguard.data" = ["*.json"]
